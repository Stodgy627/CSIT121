<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Fry Form</title>
</head>
<body>

    <h1>
        Fry Form
    </h1>

    <nav>
        <ul>
            <li><a href="tierlist.html">Tier List</a></li>
        </ul>

    </nav>

    <form>

        <div>
        <label for="name">Name: </label>
        <input type="text" id="name" placeholder="Patrick Star">
        </div>
    
        <br>
    
        <div>
        <label for="email">Email: </label>
        <input type="email" id="email">
        </div>
        
        <div>
            <p>Fry Favorite: </p>
            <label for="Chick-Fil-A">Chick-Fil-A</label>
            <input type="radio" id="Chick-Fil-A" name="fries" value="Chick-Fil-A">

            <label for="five-guys">Five Guys (Cajun)</label>
            <input type="radio" id="five-guys" name="fries" value="Five-Guys(Cajun)">

            <label for="arbys">Arby's</label>
            <input type="radio" id="arbys" name="fries" value="Arby's">

        </div>

        <div>
        <input type="reset">
        </div>

        <div>
        <input type="submit">
        </div>

    </form>
</body>
</html>
